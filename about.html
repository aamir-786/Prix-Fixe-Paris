<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À Propos - Prix Fixe Paris</title>
    <link rel="stylesheet" href="style.css">
    <script src="translations.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1 data-translate="siteTitle">Prix Fixe Paris</h1>
                <span class="tagline" data-translate="tagline">Restaurants • Menu du Jour • Formule du Midi</span>
            </div>
            <div class="header-controls">
                <div class="language-switcher">
                    <button class="language-btn active" data-lang="fr">FR</button>
                    <button class="language-btn" data-lang="en">EN</button>
                </div>
                <div class="theme-switcher">
                    <button class="theme-toggle" title="Toggle theme">
                        <span class="theme-icon sun">☀️</span>
                        <span class="theme-icon moon">🌙</span>
                    </button>
                </div>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link" data-translate="navHome">Accueil</a>
                <a href="about.html" class="nav-link active" data-translate="navAbout">À Propos</a>
                <a href="form.html" class="nav-link" data-translate="navAdd">Ajouter</a>
            </nav>
        </div>
    </header>

    <div class="banner">
        <img src="https://images.pexels.com/photos/1395967/pexels-photo-1395967.jpeg?auto=compress&cs=tinysrgb&w=1600&h=400&fit=crop" alt="Paris Restaurant Scene" class="banner-image">
        <div class="banner-overlay"></div>
    </div>

    <main class="main">
        <div class="container">
            <section class="content-section">
                <h2 data-translate="aboutTitle">À Propos de Prix Fixe Paris</h2>
                <div class="content-placeholder">
                    <p data-translate="aboutContent">Contenu à venir...</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p data-translate="footerText">&copy; 2025 Prix Fixe Paris. Tous droits réservés.</p>
        </div>
    </footer>
</body>
</html>
